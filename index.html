<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kantor Drama CEO</title>
<style>
:root{
  --bg:#12101e; --floor:#241d33; --ink:#f4f1ff; --dim:#9b93b5;
  --gold:#ffcf5c; --ok:#5ddb9a; --warn:#ff7d7d; --line:#4a3a74;
  --font:"Courier New",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);image-rendering:pixelated}
.byline{position:fixed;top:6px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;z-index:50}
.wrap{max-width:860px;margin:0 auto;padding:26px 12px 40px}
h1{font-size:20px;letter-spacing:4px;margin:4px 0 6px;text-transform:uppercase;color:var(--gold)}
.sub{font-size:11px;color:var(--dim);line-height:1.7;margin-bottom:14px}
.chip{display:inline-block;border:1px solid var(--line);padding:2px 7px;margin:2px 4px 2px 0;font-size:10px;border-radius:2px;color:var(--dim)}
.chip.ok{color:var(--ok);border-color:#2d5c45}
.floor{position:relative;border:3px solid var(--line);background:#1a142e url("scene.svg") center/100% 100% no-repeat;aspect-ratio:4/3;overflow:hidden;border-radius:4px}
.room{position:absolute;inset:0}
.desk{position:absolute;width:22%;transform:translate(-50%,-50%);cursor:pointer;background:none;border:0;padding:0;color:inherit;font-family:inherit;text-align:center}
.deskTop{position:relative;height:18px;background:#6b4e8f;border:2px solid #241a33;border-bottom-width:5px;border-radius:2px;box-shadow:0 4px 0 #1a1226}
.deskTop::before{content:"";position:absolute;left:50%;top:-13px;transform:translateX(-50%);width:22px;height:13px;background:#1d2b30;border:2px solid #241a33;border-radius:1px}
.desk.ceo .deskTop{background:#a87d2a;border-color:#3a2807}
.desk.ceo .deskTop::before{background:#5c4214}
.deskName{font-size:10px;margin-top:5px;font-weight:bold;letter-spacing:1px}
.deskRole{font-size:8px;color:var(--dim)}
.guy{position:absolute;width:44px;height:62px;transform:translate(-50%,-100%);transition:left 1.4s steps(9,end),top 1.4s steps(9,end);z-index:3}
.guy i{position:absolute;display:block}
.shadow{left:4px;top:56px;width:36px;height:7px;background:#0006;border-radius:50%}
.head{left:9px;top:6px;width:26px;height:23px;background:#f0c39b;border:2px solid #241a33;border-radius:2px}
.hair{left:9px;top:6px;width:26px;height:9px;background:#2b1d33;border:2px solid #241a33;border-bottom:0;border-radius:2px 2px 0 0}
.eyes{left:15px;top:19px;width:16px;height:4px;background:linear-gradient(90deg,#241a33 5px,transparent 5px 11px,#241a33 11px)}
.body{left:7px;top:31px;width:30px;height:19px;border:2px solid #241a33;border-radius:2px}
.arm{left:2px;top:34px;width:40px;height:6px;background:#241a33;opacity:.6;border-radius:2px}
.legs{left:12px;top:49px;width:20px;height:10px;background:#443b59;border:2px solid #241a33;border-top:0}
.crown{left:13px;top:0;width:18px;height:6px;background:var(--gold);border:1px solid #241a33}
.guy.work .arm{animation:tap .45s steps(2,end) infinite alternate}
@keyframes tap{to{transform:translateY(-3px)}}
.tag{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-size:9px;white-space:nowrap;background:#000c;padding:1px 6px;border:1px solid var(--line);border-radius:2px}
.panel{border:1px solid var(--line);background:#181329;padding:14px;border-radius:4px;margin-top:14px;min-height:100px}
.panel h2{font-size:13px;margin:0 0 6px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.panel .who{font-size:10px;color:var(--dim);margin-bottom:12px}
.kv{border-left:2px solid var(--gold);padding:3px 0 3px 10px;margin:9px 0}
.k{font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:1px}
.v{font-size:12px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.card{border:1px dashed var(--line);padding:10px;margin:10px 0;background:#140f24;border-radius:3px}
</style>
</head>
<body>
<div class="byline">Drama CEO Studio</div>
<div class="wrap">
  <h1>Kantor Drama CEO</h1>
  <div class="sub" id="meta">Memuat status agen drama…</div>

  <div class="floor" id="floor">
    <div class="room" id="room"></div>
  </div>

  <div class="panel" id="panel">
    <h2>Meja Kerja Agen</h2>
    <div class="who">Klik meja salah satu agen di atas untuk melihat ide, naskah 60 detik, prompt visual AI, atau caption.</div>
  </div>
</div>

<script>
const DESKS = {
  ceo: {x:50, y:45, nama:"CEO Agung", peran:"Pemilik & Pengarah Studio", warna:"#2b2b3a"},
  rendra: {x:22, y:65, nama:"Rendra", peran:"Konseptor Cerita & Plot", warna:"#ff9ecb"},
  karin: {x:40, y:78, nama:"Karin", peran:"Penulis Naskah & Hook 60s", warna:"#5ddb9a"},
  gilang: {x:60, y:78, nama:"Gilang", peran:"Visual & Video Prompts AI", warna:"#79b8ff"},
  vina: {x:78, y:65, nama:"Vina", peran:"Distribusi, Judul & Caption", warna:"#ffcf5c"}
};
const DOOR = {x:50, y:99};
let dataDrama = null;

const esc = s => String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function render(v){
  if(!v) return "";
  if(Array.isArray(v)) return v.map(x=>`<div class="card">${render(x)}</div>`).join("");
  if(typeof v === "object") return Object.entries(v).map(([k,x])=>
    `<div class="kv"><div class="k">${esc(k.replace(/_/g," "))}</div><div class="v">${typeof x==="object"?render(x):esc(x)}</div></div>`).join("");
  return esc(v);
}

function show(id){
  const p = document.getElementById("panel");
  const a = DESKS[id];
  if(!dataDrama){
    p.innerHTML = `<h2>${esc(a.nama)} (${esc(a.peran)})</h2><div class="who">Belum ada naskah yang digenerate. Jalankan workflow di GitHub Actions untuk memproduksi cerita pertama.</div>`;
    return;
  }
  let konten = "";
  if(id === "ceo") konten = `<div class="card"><div class="k">Kategori Terpilih</div><div class="v">${esc(dataDrama.kategori||"Universal Drama")}</div></div><div class="card"><div class="k">Status Studio</div><div class="v">Semua 4 agen bekerja otomatis menghasilkan naskah dan prompt visual.</div></div>`;
  else if(id === "rendra") konten = render(dataDrama.ide);
  else if(id === "karin") konten = render(dataDrama.naskah);
  else if(id === "gilang") konten = render(dataDrama.visual_prompts);
  else if(id === "vina") konten = render(dataDrama.distribusi);

  p.innerHTML = `<h2>${esc(a.nama)}</h2><div class="who">${esc(a.peran)}</div>${konten}`;
  p.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function buildRoom(){
  const room = document.getElementById("room");
  room.innerHTML = "";
  Object.entries(DESKS).forEach(([id, a])=>{
    const d = document.createElement("button");
    d.className = "desk" + (id === "ceo" ? " ceo" : "");
    d.style.left = a.x + "%";
    d.style.top = (a.y + 7) + "%";
    d.innerHTML = `<div class="deskTop"></div><div class="deskName">${esc(a.nama)}</div><div class="deskRole">${esc(a.peran)}</div>`;
    d.onclick = () => show(id);
    room.appendChild(d);

    const g = document.createElement("div");
    g.className = "guy";
    g.style.left = a.x + "%";
    g.style.top = a.y + "%";
    g.innerHTML = `<span class="tag">${esc(a.nama)}</span><i class="shadow"></i><i class="head"></i><i class="hair"></i><i class="eyes"></i><i class="body" style="background:${a.warna}"></i><i class="arm"></i><i class="legs"></i>${id==="ceo"?'<i class="crown"></i>':''}`;
    room.appendChild(g);
    setTimeout(()=>g.classList.add("work"), 800);
  });
}

buildRoom();

fetch("data/naskah_terbaru.json?t=" + Date.now())
  .then(r => r.json())
  .then(d => {
    dataDrama = d;
    document.getElementById("meta").innerHTML = `<span class="chip ok">Aktif: ${esc(d.tanggal||"Hari ini")}</span> <span class="chip">${esc(d.kategori||"Drama")}</span>`;
  })
  .catch(() => {
    document.getElementById("meta").innerHTML = `<span class="chip">Menunggu produksi naskah pertama...</span>`;
  });
</script>
</body>
</html>
