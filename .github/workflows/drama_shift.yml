name: Shift Kantor Drama AI

on:
  schedule:
    - cron: "0 1 * * *"   # 08:00 WIB
    - cron: "0 10 * * *"  # 17:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produksi_drama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jalankan Kantor AI Drama
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python agents/drama_office.py

      - name: Simpan Naskah & Ide ke Repo
        if: always()
        run: |
          git config user.name "kantor-drama-bot"
          git config user.email "bot@kantor-drama.local"
          git add data/
          git diff --staged --quiet || git commit -m "drama $(date +%Y-%m-%d-%H%M)"
          git pull --rebase || true
          git push
