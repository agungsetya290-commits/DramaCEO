name: Shift Kantor Drama AI

on:
  schedule:
    - cron: "0 1 * * *"   # 08:00 WIB
    - cron: "0 10 * * *"  # 17:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produksi_drama:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jalankan Kantor AI Drama
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          mkdir -p data
          python agents/drama_office.py

      - name: Simpan Naskah & Ide ke Repo
        if: always()
        run: |
          mkdir -p data
          git config user.name "kantor-drama-bot"
          git config user.email "bot@kantor-drama.local"
          git add data/ index.html || true
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan baru untuk di-commit."
          else
            git commit -m "drama: update naskah $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main || true
            git push origin main
          fi
